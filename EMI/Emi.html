<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <title>{PAGE_TITLE} | EasyCalculator</title>
  <meta name="description" content="{META_DESCRIPTION}">
</head>

<body>

<h1>{H1_TITLE}</h1>

<p>
Use this <strong>{H1_TITLE}</strong> by EasyCalculator to estimate your monthly loan
payment based on loan amount, APR, and term.
</p>

<label>Loan Amount ($)</label>
<input type="number" id="amount">

<label>APR (%)</label>
<input type="number" id="rate">

<label>Loan Term (years)</label>
<input type="number" id="years">

<button onclick="calcPayment()">Calculate Payment</button>
<p id="payment"></p>

<script>
function calcPayment(){
  let P = amount.value;
  let r = rate.value / 100 / 12;
  let n = years.value * 12;

  let m = (P * r * Math.pow(1+r,n)) / (Math.pow(1+r,n)-1);
  payment.innerText = "Monthly Payment: $" + m.toFixed(2);
}
</script>

<h2>How Monthly Loan Payments Work</h2>
<p>
US loans use APR and amortization. Your credit score,
loan term, and interest rate affect your payment.
</p>

<p>Loan calculators by <strong>EasyCalculator</strong>.</p>

</body>
</html>
